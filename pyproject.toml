[project]
name = "little-agent"
version = "0.1.0"
description = "A small stateless agent runtime: skills, tools, and an A2A interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "json-repair>=0.30.0",
  # Core safety feature: the emergency-stop hotkey (control.py) is armed on
  # every agent turn. Degrades gracefully if the backend is unavailable.
  "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
screen = [
  "mss>=9.0",
  "Pillow>=10.0",
]
control = [
  "pyautogui>=0.9.54",
]

[project.scripts]
little-agent = "little_agent.cli:main"

[tool.setuptools.packages.find]
include = ["little_agent*"]
exclude = ["skills*", "tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
